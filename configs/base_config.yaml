# Base Configuration: Bias and Domain Shift in Skin-Lesion Classification

experiment:
  name: "baseline_erm"
  seed: 42
  device: "cuda" # or "mps" / "cpu"
  output_dir: "experiments/runs"

data:
  raw_data_dir: "data/raw"
  processed_data_dir: "data/processed"
  image_size: [224, 224]
  batch_size: 32
  num_workers: 4
  tone_attribute: "fitzpatrick_tone" # Options: fitzpatrick_tone, ita_bucket
  source_dataset: "isic2019"
  target_datasets:
    - "fitzpatrick17k"
    - "pad_ufes_20"

model:
  backbone: "resnet50" # Options: resnet50, efficientnet_b4, vit_base_patch16_224
  pretrained: true
  num_classes: 2 # Binary (benign vs malignant) or multi-class (7/8 classes)
  dropout_rate: 0.2

mitigation:
  method: "none" # Options: none (ERM), group_reweighting, group_dro, dann
  group_dro_step_size: 0.01
  dann_lambda: 1.0

training:
  epochs: 50
  learning_rate: 1.0e-4
  weight_decay: 1.0e-4
  scheduler: "cosine"
  early_stopping_patience: 10

calibration:
  n_bins: 15
  post_hoc_method: "temperature_scaling"

explainability:
  target_layer: "layer4" # ResNet-50 final convolutional layer
  gradcam_colormap: "jet"
